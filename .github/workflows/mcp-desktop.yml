name: Desktop MCP specs

on:
  pull_request:
    paths:
      - 'Source/Cli/Commands/Screenplay/**'
      - 'Source/Cli/Commands/Ai/**'
      - 'Source/Cli.Specs/for_DesktopMcp/**'
      - 'Source/Cli/Commands/Direct/DirectMcp*'
      - 'Source/Cli.Specs/for_DirectMcp*/**'
      - 'Source/Cli/Program.cs'
      - '*.props'
      - '.github/workflows/mcp-desktop.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-specs:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop specs
        run: dotnet build Source/Cli.Specs/Cli.Specs.csproj --configuration Release
      - name: Exercise providers and safe personal marketplace operations on the native OS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-mcp"
          report="$RUNNER_TEMP/desktop-mcp/desktop-mcp.trx"
          dotnet Source/Cli.Specs/bin/Release/net10.0/Cratis.Cli.Specs.dll -filterVSTest "FullyQualifiedName~for_DesktopMcp|FullyQualifiedName~for_DirectMcpRegistration" -result-trx "$report"
          node -e 'const fs = require("node:fs"); const xml = fs.readFileSync(process.argv[1], "utf8"); const counters = [...xml.matchAll(/<Counters\b[^>]*\btotal="([0-9]+)"[^>]*\/>/g)]; if (counters.length !== 1 || Number(counters[0][1]) <= 0) throw new Error("Expected one positive TRX test total");' "$report"
      - name: Retain desktop results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: desktop-mcp-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-mcp/*.trx
          if-no-files-found: warn
