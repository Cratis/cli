name: Publish

# Keep up to 100 pending Publish runs in FIFO order with `queue: max` (Cratis/Direct#1517).
# The default single pending slot drops the older pending release when a third merge arrives.
# Runs remain serialized and in-flight releases are never cancelled.
# Omit `cancel-in-progress`: GitHub rejects it together with `queue: max`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  #
  # The paths filter stays. On its own the label is gate enough - but verify-published below turns an
  # unlabeled merge into a failure, and a documentation-only pull request carries no label by design. Without
  # the filter every documentation merge would go red on main, which is how a check becomes noise people learn
  # to ignore. The filter keeps this workflow to the merges that are actually meant to release.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "*.props"
      - "*.targets"
      # README.md is the package readme (PackageReadmeFile packs it from the repository root),
      # so a README-only merge changes the published package and must be able to release.
      # PR #122 was labeled patch for exactly that reason and silently released nothing.
      - "README.md"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    permissions:
      issues: write
      contents: write
      # Required for NuGet trusted publishing using OIDC tokens
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

      # Every build embeds the notes of every release up to its own (ReleaseNotes/, see
      # scripts/generate-version-release-notes.mjs), for 'cratis release-notes' and 'cratis update'.
      # The build jobs add this release's file themselves (they build exactly the released commit); this step
      # keeps it on main so later builds have it too. It never fails the release, and it retries when another
      # merge moves main between fetching and pushing. The GitHub release only exists once release-action's post
      # step has run, after this job's steps, so the notes come from the action's decision instead.
      - name: Commit release notes to main
        if: steps.release.outputs.should-publish == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq -r '.releaseNotes // empty' <<< "$CRATIS_RELEASE_ACTION_DECISION" > "$RUNNER_TEMP/release-body.md"
          if [ ! -s "$RUNNER_TEMP/release-body.md" ]; then
            echo "::warning::No release notes in the release decision for $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-notes origin/main
            node scripts/generate-version-release-notes.mjs --version "$VERSION" --body-file "$RUNNER_TEMP/release-body.md" --output ReleaseNotes
            git add ReleaseNotes
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Add release notes for $VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved; retrying ($attempt)"
          done
          echo "::warning::Could not commit the release notes for $VERSION to main"

  publish:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add this release's notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          node scripts/generate-version-release-notes.mjs --version "$VERSION" --body-file "$RUNNER_TEMP/release-body.md" --output ReleaseNotes

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Restore
        run: dotnet restore --property:Configuration=Release --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ needs.release.outputs.version }}

      - name: Create NuGet packages
        run: dotnet pack Source/Cli/Cli.csproj --no-build --configuration Release -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  publish-native:
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    uses: ./.github/workflows/publish-native.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
