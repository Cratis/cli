name: Markdown Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Documentation/**"
      - ".markdownlint.json"
      - ".github/workflows/markdown-verification.yml"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: 'Documentation/**/*.md'

  link-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Site-absolute links point at the aggregated documentation site, which is built from every product
      # repository at once - there is nothing in this repository for them to resolve to, and the Documentation
      # repository's own build verifies them. Everything else, including every relative link within this
      # repository, is checked. This is the same command Documentation/verify-markdown.sh runs; keep them in sync.
      # GitHub rate-limits link checks with HTTP 429, which says nothing about whether the link works, so a 429 is
      # reported as a warning instead of a broken link. linkinator-action@v1 bundles linkinator 6.1.2, which cannot
      # map status codes, so the pinned CLI is used directly.
      - name: Check links in Documentation
        run: >-
          npx --yes linkinator@8.1.0 "Documentation/**/*.md"
          --markdown --recurse --verbosity error
          --status-code "403:ok" --status-code "429:warn"
          --skip '^https?://(localhost|127\.0\.0\.1):[0-9]+/(?!Documentation/)'
