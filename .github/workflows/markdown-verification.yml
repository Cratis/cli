name: Markdown Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Documentation/**"
      - ".markdownlint.json"
      - ".github/workflows/markdown-verification.yml"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: 'Documentation/**/*.md'

  link-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Site-absolute links point at the aggregated documentation site, which is built from every product
      # repository at once - there is nothing in this repository for them to resolve to, and the Documentation
      # repository's own build verifies them. Everything else, including every relative link within this
      # repository, is checked. This is the same command Documentation/verify-markdown.sh runs; keep them in sync.
      # GitHub rate-limits link checks with HTTP 429, which says nothing about whether the link works, so a 429 passes
      # and is logged as a warning (verbosity warning keeps it visible) instead of failing as a broken link. GitHub also answers
      # existing blob pages with a transient 503, which is treated the same way; a missing page still fails with 404. A 403 passes too. linkinator-action@v1 bundles linkinator 6.1.2, which cannot
      # map status codes, so the pinned CLI is used directly.
      - name: Check links in Documentation
        run: >-
          npx --yes linkinator@8.1.0 "Documentation/**/*.md"
          --markdown --recurse --verbosity warning
          --status-code "403:ok" --status-code "429:warn" --status-code "503:warn"
          --skip '^https?://(localhost|127\.0\.0\.1):[0-9]+/(?!Documentation/)'
