name: Publish builder image

# Publishes the packaged Cratis builder (Docker/builder/Dockerfile) to Docker Hub as cratis/builder for a released
# version of the CLI. Publish calls it after every release; run it by hand to republish a version. `cratis build run
# --docker` pulls the image that matches the CLI it runs from.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Released Cratis.Cli version to package'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image installs the CLI from NuGet, which can list a version minutes before it can install it.
      - name: Wait until NuGet installs the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            if dotnet tool install Cratis.Cli --version "${VERSION}" --tool-path "${RUNNER_TEMP}/cratis-probe" > /dev/null 2>&1; then
              echo "Cratis.Cli ${VERSION} installs from NuGet."
              exit 0
            fi
            rm -rf "${RUNNER_TEMP}/cratis-probe"
            sleep 30
          done
          echo "::error::Cratis.Cli ${VERSION} could not be installed from NuGet after 20 minutes."
          exit 1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the image
        env:
          VERSION: ${{ inputs.version }}
        run: docker build -f Docker/builder/Dockerfile --build-arg "CLI_VERSION=${VERSION}" -t "cratis/builder:${VERSION}" -t cratis/builder:latest .

      - name: Publish the image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker push "cratis/builder:${VERSION}"
          docker push cratis/builder:latest
