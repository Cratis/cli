name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Integration/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "global.json"
      - "*.props"
      - "*.targets"

jobs:
  workspace-file-admission:
    name: Workspace file admission (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build workspace input specs
        run: dotnet build Source/Cli.Specs/Cli.Specs.csproj --configuration Release

      - name: Verify native workspace input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workspace-file-admission"
          report="$RUNNER_TEMP/workspace-file-admission/workspace-file-admission.trx"
          dotnet Source/Cli.Specs/bin/Release/net10.0/Cratis.Cli.Specs.dll -filterVSTest "FullyQualifiedName~and_workspace_file_admission_is_safe" -result-trx "$report"
          node -e 'const fs = require("node:fs"); const xml = fs.readFileSync(process.argv[1], "utf8"); const counters = [...xml.matchAll(/<Counters\b[^>]*\btotal="([0-9]+)"[^>]*\/>/g)]; if (counters.length !== 1 || Number(counters[0][1]) <= 0) throw new Error("Expected one positive TRX test total");' "$report"

      - name: Retain platform results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: workspace-file-admission-${{ matrix.os }}
          path: ${{ runner.temp }}/workspace-file-admission/*.trx
          if-no-files-found: warn

  native-screenplay-placement:
    name: Native Screenplay placement (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Source/Cli/Cli.csproj -r linux-x64 --source https://api.nuget.org/v3/index.json

      - name: Publish native CLI
        run: >-
          dotnet publish Source/Cli/Cli.csproj --no-restore
          -c Release -r linux-x64 -p:SelfContained=true -p:PublishSingleFile=true
          -o ./publish/linux-x64

      - name: Verify native Screenplay placement
        timeout-minutes: 10
        run: ./scripts/test-packaged-screenplay-placement.sh --native ./publish/linux-x64/Cratis.Cli

  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore --property:Configuration=Release --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The integration fixture starts a Chronicle container whose image is named after the Chronicle
      # package version, so a version bump always faces a cold ~400MB pull. Testcontainers times the first
      # start attempt out while that pull is running, and every retry then collides with the port the
      # timed-out attempt is still holding — surfacing as "Bind for 0.0.0.0:27018 failed: port is already
      # allocated", which reads like a code failure and is not one. Pulling first takes the download off
      # the start clock.
      # The images come through a public mirror (scripts/pull-ci-images.sh): anonymous Docker Hub pulls from
      # the shared runner IPs hit the rate limit. The Stage image is the one the shell and rendered-app
      # scenarios start through `cratis run`.
      - name: Pull the Chronicle and Stage test images
        run: |
          CHRONICLE=$(grep -oE 'Include="Cratis.Chronicle.Connections" Version="[^"]+"' Directory.Packages.props | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          STAGE=$(grep -oE '<StageVersion[^>]*>[^<]+' Directory.Packages.props | sed 's/.*>//')
          ./scripts/pull-ci-images.sh "cratis/chronicle:$CHRONICLE-development" "cratis/stage:$STAGE"

      # Run the already-built xUnit v3 executables directly; no second build or VSTest host.
      - name: Run specifications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/specifications"
          for project in Cli.Specs Templating.Specs Templating.Conformance; do
            case "$project" in
              Cli.Specs) assembly=Cratis.Cli.Specs ;;
              *) assembly="Cratis.$project" ;;
            esac
            report="$RUNNER_TEMP/specifications/$project.trx"
            dotnet "Source/$project/bin/Release/net10.0/$assembly.dll" -result-trx "$report"
            node -e 'const fs = require("node:fs"); const xml = fs.readFileSync(process.argv[1], "utf8"); const counters = [...xml.matchAll(/<Counters\b[^>]*\btotal="([0-9]+)"[^>]*\/>/g)]; if (counters.length !== 1 || Number(counters[0][1]) <= 0) throw new Error("Expected one positive TRX test total");' "$report"
          done

      - name: Retain specification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: specification-results
          path: ${{ runner.temp }}/specifications/*.trx
          if-no-files-found: warn

      - name: Test Chronicle integration
        run: dotnet test Integration/Chronicle/Chronicle.csproj --no-build --no-restore --configuration Release

      - name: Pack sentinel CLI tool
        run: |
          mkdir -p artifacts/cli-tool
          dotnet pack Source/Cli/Cli.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/cli-tool \
            -p:PackageVersion=0.0.0-screenplay-placement

      - name: Verify packaged Screenplay placement
        timeout-minutes: 10
        run: ./scripts/test-packaged-screenplay-placement.sh artifacts/cli-tool 0.0.0-screenplay-placement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Renders the canonical screen-composition corpus with the packed CLI, builds and launches the generated React
      # application on its generated backend, and runs Stage's own generated-React browser scenarios against it.
      - name: Verify the rendered React application
        timeout-minutes: 20
        run: ./scripts/test-rendered-react-application.sh artifacts/cli-tool 0.0.0-screenplay-placement

      # Runs the application shell fixture (navigation regions across three modules, a toolbar slice dialog, deep links, sample data
      # that never ships) through `cratis run` on a live Stage and through `cratis render`, a build and a launch, with one browser scenario.
      - name: Verify the application shell on a live Stage and in a rendered application
        timeout-minutes: 25
        env:
          CRATIS_SHELL_RESULTS: ${{ runner.temp }}/shell-results
        run: ./scripts/test-shell-application.sh artifacts/cli-tool 0.0.0-screenplay-placement

      - name: Retain the application shell screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: shell-results
          path: ${{ runner.temp }}/shell-results
          if-no-files-found: ignore
